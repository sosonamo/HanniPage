<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basketball Interactive Intro</title>
  <style>
    :root {
      --page-bg: #0b1220;
      --page-bg-deep: #050912;
      --text-main: #f6f7fb;
      --text-sub: rgba(246, 247, 251, 0.62);
      --line: rgba(255, 255, 255, 0.13);
      --button-bg: rgba(255, 255, 255, 0.08);
      --ball-size: 60px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      position: relative;
      color: var(--text-main);
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.08), transparent 30%),
        linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-deep) 100%);
      font-family:
        Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }

    .page-content {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
      pointer-events: none;
    }

    .hero {
      max-width: 760px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: rgba(255, 154, 38, 0.82);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.22em;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 84px);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .description {
      margin: 20px auto 0;
      color: var(--text-sub);
      font-size: clamp(14px, 1.6vw, 18px);
      line-height: 1.7;
    }

    .floor-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(64px, 8vh);
      height: 1px;
      background: var(--line);
      pointer-events: none;
    }

    .start-layer {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: end center;
      padding: 0 24px 30px;
      cursor: pointer;
      background: transparent;
      transition: opacity 180ms ease;
    }

    .start-layer.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.82);
      background: var(--button-bg);
      backdrop-filter: blur(10px);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .start-button::before {
      content: "▶";
      font-size: 10px;
    }

    .replay-button {
      position: fixed;
      z-index: 30;
      right: 24px;
      bottom: 24px;
      display: none;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.82);
      background: var(--button-bg);
      backdrop-filter: blur(10px);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .replay-button.is-visible {
      display: inline-flex;
      align-items: center;
    }

    @media (max-width: 640px) {
      :root {
        --ball-size: 48px;
      }

      .page-content {
        padding: 24px;
      }

      .description {
        max-width: 320px;
      }

      .replay-button {
        right: 16px;
        bottom: 18px;
      }

<body>
  <main class="page-content" aria-label="메인 화면">
    <section class="hero">
      <p class="eyebrow">INTERACTIVE INDEX</p>
      <h1>BASKETBALL<br />STARTS HERE</h1>
      <p class="description">
        농구공이 크게 바운드한 뒤 작게 통통통 전진하고,<br />
        마지막 움직임을 이어 오른쪽으로 부드럽게 굴러 퇴장합니다.
      </p>
    </section>
  </main>

  <div class="floor-line" aria-hidden="true"></div>
  <div class="basketball" id="basketball" aria-hidden="true"></div>

  <div class="start-layer" id="startLayer" role="button" tabindex="0">
    <button class="start-button" type="button">
      화면을 클릭하면 소리와 함께 시작합니다
    </button>
  </div>

  <button class="replay-button" id="replayButton" type="button">
    다시 보기
  </button>

  <script>
    (() => {
      "use strict";

      const ball = document.getElementById("basketball");
      const startLayer = document.getElementById("startLayer");
      const replayButton = document.getElementById("replayButton");

      const TIMELINE = {
        firstImpact: 1.15,
        secondImpact: 2.55,
        thirdImpact: 3.55,
        mini1Impact: 3.96,
        mini2Impact: 4.30,
        mini3Impact: 4.59,
        finish: 6.38
      };

      let audioContext = null;
      let animationFrameId = null;
      let animationStartTime = 0;
      let isRunning = false;
      let playedImpacts = [false, false, false, false, false, false];
      let previousX = 0;
      let accumulatedRotation = 0;
      let activeMetrics = null;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const lerp = (from, to, amount) => from + (to - from) * amount;
      const easeInQuad = (value) => value * value;
      const easeInOutSine = (value) => -(Math.cos(Math.PI * value) - 1) / 2;

      function getSceneMetrics() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const ballSize = ball.getBoundingClientRect().width;
        const radius = ballSize / 2;
        const floorOffset = Math.max(64, height * 0.08);
        const floorY = height - floorOffset - radius;

        return {
          width,
          height,
          radius,
          floorY,
          start: {
            x: radius + Math.max(14, width * 0.018),
            y: radius + Math.max(14, height * 0.025)
          },
          impact1X: width * 0.26,
          impact2X: width * 0.50,
          impact3X: width * 0.68,
          mini1X: width * 0.690,
          mini2X: width * 0.703,
          mini3X: width * 0.718,
          exitX: width + radius * 2.4
        };
      }

      async function ensureAudioContext() {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioContext = new AudioContextClass({ latencyHint: "interactive" });
          }
        }

        if (audioContext && audioContext.state === "suspended") {
          await audioContext.resume();
        }

        if (audioContext) {
          const buffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);
          source.start();
        }
      }

      function playBounceSound(index) {
        if (!audioContext) return;

        const now = audioContext.currentTime;
        const frequencies = [165, 146, 128, 121, 114, 108];
        const volumes = [0.28, 0.23, 0.19, 0.12, 0.10, 0.09];
        const durations = [0.14, 0.13, 0.12, 0.10, 0.095, 0.09];

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequencies[index], now);
        oscillator.frequency.exponentialRampToValueAtTime(
          frequencies[index] * 0.58,
          now + durations[index] * 0.8
        );

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volumes[index], now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + durations[index]);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + durations[index] + 0.01);
      }

      function updateImpactSounds(elapsedSeconds) {
        const impactTimes = [
          TIMELINE.firstImpact,
          TIMELINE.secondImpact,
          TIMELINE.thirdImpact,
          TIMELINE.mini1Impact,
          TIMELINE.mini2Impact,
          TIMELINE.mini3Impact
        ];

        impactTimes.forEach((impactTime, index) => {
          if (!playedImpacts[index] && elapsedSeconds >= impactTime) {
            playedImpacts[index] = true;
            playBounceSound(index);
          }
        });
      }

      function parabola(progress, height) {
        return height * 4 * progress * (1 - progress);
      }

      function getPosition(elapsedSeconds, metrics) {
        const {
          floorY,
          height,
          start,
          impact1X,
          impact2X,
          impact3X,
          mini1X,
          mini2X,
          mini3X,
          exitX
        } = metrics;

        if (elapsedSeconds <= TIMELINE.firstImpact) {
          const progress = clamp(elapsedSeconds / TIMELINE.firstImpact, 0, 1);
          const fallProgress = easeInQuad(progress);

          return {
            x: lerp(start.x, impact1X, progress),
            y: lerp(start.y, floorY, fallProgress)
          };
        }

        if (elapsedSeconds <= TIMELINE.secondImpact) {
          const progress = clamp(
            (elapsedSeconds - TIMELINE.firstImpact) /
            (TIMELINE.secondImpact - TIMELINE.firstImpact),
            0,
            1
          );
          const bounceHeight = Math.min(height * 0.40, 390);

          return {
            x: lerp(impact1X, impact2X, progress),
            y: floorY - parabola(progress, bounceHeight)
          };
        }

        if (elapsedSeconds <= TIMELINE.thirdImpact) {
          const progress = clamp(
            (elapsedSeconds - TIMELINE.secondImpact) /
            (TIMELINE.thirdImpact - TIMELINE.secondImpact),
            0,
            1
          );
          const bounceHeight = Math.min(height * 0.21, 205);

          return {
            x: lerp(impact2X, impact3X, progress),
            y: floorY - parabola(progress, bounceHeight)
          };
        }

        if (elapsedSeconds <= TIMELINE.mini1Impact) {
          const progress = clamp(
            (elapsedSeconds - TIMELINE.thirdImpact) /
            (TIMELINE.mini1Impact - TIMELINE.thirdImpact),
            0,
            1
          );
          const bounceHeight = Math.min(height * 0.052, 40);

          return {
            x: lerp(impact3X, mini1X, progress),
            y: floorY - parabola(progress, bounceHeight)
          };
        }

        if (elapsedSeconds <= TIMELINE.mini2Impact) {
          const progress = clamp(
            (elapsedSeconds - TIMELINE.mini1Impact) /
            (TIMELINE.mini2Impact - TIMELINE.mini1Impact),
            0,
            1
          );
          const bounceHeight = Math.min(height * 0.031, 24);

          return {
            x: lerp(mini1X, mini2X, progress),
            y: floorY - parabola(progress, bounceHeight)
          };
        }

        if (elapsedSeconds <= TIMELINE.mini3Impact) {
          const progress = clamp(
            (elapsedSeconds - TIMELINE.mini2Impact) /
            (TIMELINE.mini3Impact - TIMELINE.mini2Impact),
            0,
            1
          );
          const bounceHeight = Math.min(height * 0.017, 13);

          return {
            x: lerp(mini2X, mini3X, progress),
            y: floorY - parabola(progress, bounceHeight)
          };
        }

        const rollProgress = clamp(
          (elapsedSeconds - TIMELINE.mini3Impact) /
          (TIMELINE.finish - TIMELINE.mini3Impact),
          0,
          1
        );

        /*
          시작 기울기가 0이 아닌 곡선을 사용합니다.
          따라서 마지막 작은 바운드의 오른쪽 움직임이 끊기지 않고
          곧바로 부드러운 굴림으로 이어집니다.
        */
        const rollingCurve =
          0.14 * rollProgress +
          0.86 * (
            rollProgress *
            rollProgress *
            (3 - 2 * rollProgress)
          );

        return {
          x: lerp(mini3X, exitX, rollingCurve),
          y: floorY
        };
      }

      function renderBall(position, metrics) {
        const deltaX = position.x - previousX;

        accumulatedRotation +=
          (deltaX / Math.max(metrics.radius, 1)) * (180 / Math.PI);

        const translateX = position.x - metrics.radius;
        const translateY = position.y - metrics.radius;

        ball.style.transform =
          `translate3d(${translateX}px, ${translateY}px, 0px) rotateZ(${accumulatedRotation}deg)`;

        previousX = position.x;
      }

      function animate(currentTime) {
        if (!isRunning) return;

        const elapsedSeconds = (currentTime - animationStartTime) / 1000;
        const metrics = activeMetrics;
        const position = getPosition(elapsedSeconds, metrics);

        updateImpactSounds(elapsedSeconds);
        renderBall(position, metrics);

        if (elapsedSeconds < TIMELINE.finish) {
          animationFrameId = requestAnimationFrame(animate);
          return;
        }

        isRunning = false;
        animationFrameId = null;

        if (window.parent !== window) {
          window.parent.postMessage(
            { type: "hanni-intro-complete" },
            window.location.origin
          );
        } else {
          replayButton.classList.add("is-visible");
        }
      }

      function resetBall() {
        const metrics = activeMetrics || getSceneMetrics();
        previousX = metrics.start.x;
        accumulatedRotation = 0;
        playedImpacts = [false, false, false, false, false, false];

        const translateX = metrics.start.x - metrics.radius;
        const translateY = metrics.start.y - metrics.radius;

        ball.style.transform =
          `translate3d(${translateX}px, ${translateY}px, 0px) rotateZ(0deg)`;
      }

      function startAnimation() {
        if (isRunning) return;

        ensureAudioContext().catch(() => {});

        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
        }

        activeMetrics = getSceneMetrics();
        isRunning = true;
        replayButton.classList.remove("is-visible");
        startLayer.classList.add("is-hidden");
        resetBall();

        animationStartTime = performance.now();
        animationFrameId = requestAnimationFrame(animate);
      }

      startLayer.addEventListener("click", startAnimation);

      startLayer.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startAnimation();
        }
      });

      replayButton.addEventListener("click", startAnimation);

      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "r" && !isRunning) {
          startAnimation();
        }
      });

      window.addEventListener("resize", () => {
        if (!isRunning) {
          activeMetrics = getSceneMetrics();
          resetBall();
        }
      });

      activeMetrics = getSceneMetrics();
      resetBall();
    })();
  </script>
</body>
</html>
